name: watchdog

on:
  schedule:
    - cron: "2-59/5 * * * *"  # 5분마다(2, 7, 12분…). 정각 부근은 GitHub 실행이 몰려 늦어지기 쉬워 피함
  workflow_dispatch:

permissions:
  contents: write           # state/alerted 기록용

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: 서버 신호 확인
        env:
          HEARTBEAT: ${{ vars.HEARTBEAT }}
          STALE_MIN: ${{ vars.STALE_MIN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
          TG_API: ${{ vars.TG_API }}   # 비워 두면 텔레그램. 시험할 때만 다른 주소로 바꿈
        run: bash check.sh
